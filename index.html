<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - West End Cleaning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bibliotecas Oficiais do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-slate-100 flex flex-col items-center relative">
        <img src="logo.png" alt="West End Cleaning Logo" class="h-24 mb-6 object-contain" onerror="this.style.display='none'">
        
        <h2 class="text-2xl font-black text-slate-800 mb-2">System Access</h2>
        <p class="text-sm text-slate-500 font-medium mb-8 text-center">Who is logging in?</p>

        <div class="w-full space-y-6 flex flex-col items-center">
            
            <!-- Lista Dinâmica de Usuários do Firebase -->
            <div id="users-grid" class="grid grid-cols-2 gap-3 w-full max-h-48 overflow-y-auto p-1">
                <p class="text-slate-400 text-sm col-span-2 text-center py-2">Loading users...</p>
            </div>

            <!-- Senha -->
            <div class="w-full">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1 text-center">Enter your password</label>
                <input type="password" id="password" class="w-full p-4 text-center bg-slate-50 border border-slate-200 rounded-xl font-bold focus:outline-none focus:border-[#547C44] focus:ring-2 focus:ring-[#547C44]/20 transition-all" placeholder="••••••••">
            </div>

            <button onclick="fazerLogin()" class="w-full mt-2 py-4 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl shadow-md transition-colors text-lg flex items-center justify-center gap-2">
                Login
            </button>
            
            <p id="error-msg" class="text-red-500 font-bold text-sm hidden mt-2 text-center"></p>

            <button onclick="abrirModalCriar()" class="text-xs text-slate-400 hover:text-[#547C44] font-bold mt-2 transition-colors underline">Create new user profile</button>
        </div>
    </div>

    <!-- MODAL DE CRIAR USUÁRIO -->
    <div id="modal-criar" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl border border-slate-100">
            <h3 class="text-xl font-black text-slate-800 mb-1">Create Profile</h3>
            <p class="text-sm text-slate-500 mb-6">Restricted area. Requires Master Key.</p>

            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Name</label>
            <input type="text" id="new-user-name" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44] mb-4">

            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Create Password</label>
            <input type="password" id="new-user-pass" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44] mb-4">

            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1 text-red-500">Master Secret Key</label>
            <input type="password" id="master-key" class="w-full p-3 bg-slate-50 border border-red-200 rounded-xl focus:outline-none focus:border-red-500 mb-6" placeholder="Admin Key Required">

            <div class="flex gap-3">
                <button onclick="fecharModalCriar()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-colors">Cancel</button>
                <button onclick="criarUsuario()" class="flex-1 py-3 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl shadow-md transition-colors">Create</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBSPim1j9yxA56AeWhWhdG_8TKzh_F-gZc",
            authDomain: "westend-c6992.firebaseapp.com",
            projectId: "westend-c6992",
            storageBucket: "westend-c6992.firebasestorage.app",
            messagingSenderId: "781546407326",
            appId: "1:781546407326:web:ed4126214f41498153428f",
            measurementId: "G-DEGC00501H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // CHAVE DE SEGURANÇA PARA CRIAR USUÁRIOS
        const MASTER_KEY = "admin123";

        let userSelecionado = null;
        let dbUsers = {}; 

        window.onload = function() {
            if (localStorage.getItem('loggedUser')) window.location.href = 'menu.html';
            carregarUsuarios();
        };

        async function carregarUsuarios() {
            const grid = document.getElementById('users-grid');
            try {
                const snapshot = await db.collection("users").get();
                dbUsers = {};
                
                if(snapshot.empty) {
                    grid.innerHTML = '<p class="text-slate-400 text-sm col-span-2 text-center">No users found. Create one.</p>';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const nome = doc.id;
                    const dados = doc.data();
                    dbUsers[nome] = dados.pass;
                    
                    html += `<button type="button" id="btn-${nome}" onclick="selecionarUsuario('${nome}')" class="user-btn py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-bold hover:bg-slate-100 transition-all font-medium text-sm truncate px-2">${nome}</button>`;
                });
                grid.innerHTML = html;
            } catch(e) {
                grid.innerHTML = '<p class="text-red-500 text-sm col-span-2 text-center">Error loading DB</p>';
            }
        }

        function selecionarUsuario(nome) {
            userSelecionado = nome;
            document.getElementById('error-msg').classList.add('hidden');
            
            document.querySelectorAll('.user-btn').forEach(btn => {
                btn.classList.remove('bg-[#547C44]', 'text-white', 'border-[#547C44]', 'shadow-md');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
            });
            
            const btnFocus = document.getElementById(`btn-${nome}`);
            btnFocus.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200');
            btnFocus.classList.add('bg-[#547C44]', 'text-white', 'border-[#547C44]', 'shadow-md');
        }

        function fazerLogin() {
            const p = document.getElementById('password').value;
            const err = document.getElementById('error-msg');
            
            if (!userSelecionado) {
                err.innerText = "Please select your name first.";
                err.classList.remove('hidden');
                return;
            }

            if (dbUsers[userSelecionado] === p) {
                localStorage.setItem('loggedUser', userSelecionado);
                window.location.href = 'menu.html';
            } else {
                err.innerText = "Incorrect Password!";
                err.classList.remove('hidden');
            }
        }

        /* ----- SISTEMA DE CRIAR CONTA ----- */
        function abrirModalCriar() {
            document.getElementById('new-user-name').value = '';
            document.getElementById('new-user-pass').value = '';
            document.getElementById('master-key').value = '';
            document.getElementById('modal-criar').classList.remove('hidden');
        }

        function fecharModalCriar() {
            document.getElementById('modal-criar').classList.add('hidden');
        }

        async function criarUsuario() {
            const nome = document.getElementById('new-user-name').value.trim();
            const pass = document.getElementById('new-user-pass').value.trim();
            const key = document.getElementById('master-key').value.trim();

            if(!nome || !pass) return alert("Fill all fields.");
            if(key !== MASTER_KEY) return alert("Invalid Master Key! You are not allowed to create profiles.");

            try {
                await db.collection("users").doc(nome).set({ pass: pass });
                alert("Profile created successfully!");
                fecharModalCriar();
                carregarUsuarios();
            } catch(e) {
                alert("Error: " + e.message);
            }
        }
    </script>
</body>
</html>
