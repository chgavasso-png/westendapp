<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <!-- Adicionada a biblioteca jsPDF para gerar o PDF diretamente desta página -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen pb-20">
    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto">
                <a href="menu.html" class="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg></a>
                <div><h2 id="page-title" class="text-xl font-extrabold text-slate-800">New Report</h2><p class="text-xs text-slate-500 font-medium uppercase mt-1">Logged as: <span id="logged-user-name" class="font-bold text-slate-700"></span></p></div>
            </div>
            <!-- Botoes atualizados com a nova opção de PDF -->
            <div class="flex gap-3 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button id="btn-pdf-direto" onclick="gerarPDFDireto()" class="whitespace-nowrap px-6 py-2.5 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl shadow-md transition-colors flex items-center gap-2">
                    📄 Generate PDF
                </button>
                <button onclick="salvarRelatorio()" class="whitespace-nowrap px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md transition-colors">
                    💾 Save Online
                </button>
            </div>
        </div>
    </div>
    
    <div class="max-w-5xl mx-auto p-6 space-y-6 mt-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <h3 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-2">Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <input type="text" id="report-building" class="p-3 bg-slate-50 border rounded-xl font-medium" placeholder="Building / Property">
                <input type="text" id="employee-name" oninput="atualizarResumoPadrao()" class="p-3 bg-slate-50 border rounded-xl font-medium" placeholder="Cleaning Staff Name">
                <input type="date" id="report-date" class="p-3 bg-slate-50 border rounded-xl font-medium">
                <div class="bg-slate-50 border rounded-xl p-3"><p class="text-xs font-extrabold text-slate-500 uppercase tracking-widest mb-3">Report Type</p>
                    <div class="grid grid-cols-3 gap-2">
                    <button type="button" id="period-daily" onclick="selecionarPeriodo('Daily')" class="period-btn px-3 py-2 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Daily</button>
                    <button type="button" id="period-weekly" onclick="selecionarPeriodo('Weekly')" class="period-btn px-3 py-2 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Weekly</button>
                    <button type="button" id="period-monthly" onclick="selecionarPeriodo('Monthly')" class="period-btn px-3 py-2 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Monthly</button>
                    </div>
                </div>
                <div class="md:col-span-2 bg-slate-50 border rounded-xl p-4"><p class="text-xs font-extrabold text-slate-500 uppercase tracking-widest mb-3">Select what will appear in the PDF</p>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                    <button type="button" id="display-date" onclick="selecionarOpcaoPDF('date')" class="pdf-option-btn px-3 py-3 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Show Date</button>
                    <button type="button" id="display-period" onclick="selecionarOpcaoPDF('period')" class="pdf-option-btn px-3 py-3 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Show Type</button>
                    <button type="button" id="display-both" onclick="selecionarOpcaoPDF('both')" class="pdf-option-btn px-3 py-3 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Show Both</button>
                    <button type="button" id="display-none" onclick="selecionarOpcaoPDF('none')" class="pdf-option-btn px-3 py-3 rounded-xl font-bold text-sm border transition-all hover:bg-slate-200">Show Neither</button>
                    </div>
                </div>
                <textarea id="report-summary" rows="4" class="md:col-span-2 p-3 bg-slate-50 border rounded-xl font-medium" placeholder="Summary of Work"></textarea>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <h3 class="text-lg font-bold text-slate-800">Cleaned Areas</h3>
            <div id="locations-list" class="space-y-6"></div>
            <div class="flex gap-3">
                <button onclick="addLocation()" class="flex-1 py-5 border-2 border-dashed rounded-2xl font-bold text-slate-500 hover:bg-slate-50 transition-colors">+ Add New Location</button>
            </div>
        </div>
    </div>

    <script>
        // ===== SUPABASE CONFIG =====
        const SUPABASE_URL = 'https://wkndzjnqypsyluhgrdil.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbmR6am5xeXBzeWx1aGdyZGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzU5MTQsImV4cCI6MjA5NTA1MTkxNH0.6W9dsBVCeLzT3EIHyQ5ZFmQhEOyj586K9po4cj9wJeA';

        const $ = id => document.getElementById(id);
        let loggedUser = null, loggedFullName = null, loggedRole = null;
        let locations = [], editId = null;
        let resumoFoiEditadoManual = false, selectedPeriod = null, selectedPdfDisplayOption = null;

        window.onload = function() {
            loggedUser = localStorage.getItem('loggedUser');
            if (!loggedUser) return window.location.href = 'index.html';

            loggedFullName = localStorage.getItem('loggedFullName') || loggedUser;
            loggedRole = localStorage.getItem('loggedRole') || 'Staff';

            $('logged-user-name').innerText = `${loggedFullName} | ${loggedRole}`;

            editId = new URLSearchParams(window.location.search).get('id');
            $('report-summary').addEventListener('input', () => resumoFoiEditadoManual = true);

            if (editId) carregarRelatorioParaEdicao(editId);
            else {
                $('report-date').valueAsDate = new Date(); $('employee-name').value = '';
                selectedPeriod = null; selectedPdfDisplayOption = null;
                atualizarEstiloBotoes('.period-btn', 'period', selectedPeriod);
                atualizarEstiloBotoes('.pdf-option-btn', 'display', selectedPdfDisplayOption);
                atualizarResumoPadrao(true); addLocation();
            }
        };

        const atualizarEstiloBotoes = (selector, prefix, selectedVal) => {
            document.querySelectorAll(selector).forEach(b => { b.classList.remove('bg-slate-800', 'text-white', 'border-slate-800', 'shadow-md'); b.classList.add('bg-white', 'text-slate-700', 'border-slate-300'); });
            if (!selectedVal) return;
            const btn = $(`${prefix}-${selectedVal.toLowerCase()}`);
            if (btn) { btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-300'); btn.classList.add('bg-slate-800', 'text-white', 'border-slate-800', 'shadow-md'); }
        };

        const selecionarPeriodo = val => { selectedPeriod = val; atualizarEstiloBotoes('.period-btn', 'period', val); };
        const selecionarOpcaoPDF = val => { selectedPdfDisplayOption = val; atualizarEstiloBotoes('.pdf-option-btn', 'display', val); };
        const gerarTextoResumoPadrao = nome => `Cleaning staff member ${nome?.trim() || '[employee name]'} carried out cleaning tasks in the following areas using appropriate machinery and equipment. The work included floor cleaning and dust removal with the machine.`;
        const atualizarResumoPadrao = force => { const e = $('employee-name').value; if(force || !resumoFoiEditadoManual || !$('report-summary').value.trim() || $('report-summary').value.includes('Cleaning staff member')){ $('report-summary').value = gerarTextoResumoPadrao(e); resumoFoiEditadoManual = false; } };

        const addLocation = () => { locations.push({ id: Date.now().toString(), name: '', sublocations: [], photos: [] }); renderLocations(); };

        const removeLocation = (id) => {
            if (!confirm('Delete this location and all its photos?')) return;
            locations = locations.filter(l => l.id !== id);
            renderLocations();
        };

        const removePhoto = (id, pIdx) => { locations.find(l => l.id === id)?.photos.splice(pIdx, 1); renderLocations(); };

        const addSublocation = (id) => { const loc = locations.find(l => l.id === id); if(loc) { loc.sublocations = loc.sublocations || []; loc.sublocations.push(''); renderLocations(); } };
        const removeSublocation = (id, idx) => { const loc = locations.find(l => l.id === id); if(loc && loc.sublocations) { loc.sublocations.splice(idx, 1); renderLocations(); } };

        const renderLocations = () => {
            $('locations-list').innerHTML = locations.map((loc, i) => `
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <div class="flex justify-between items-center mb-2">
                        <input value="${loc.name}" oninput="locations[${i}].name=this.value" class="w-full p-2 font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-300" placeholder="Main Location Name (e.g., Reception)">
                        <button onclick="removeLocation('${loc.id}')" class="ml-3 px-3 py-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg font-bold text-sm transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Delete
                        </button>
                    </div>

                    <div class="mb-4 space-y-2">
                    ${(loc.sublocations || []).map((sub, si) => `
                    <div class="flex gap-2 ml-4 pl-3 border-l-2 border-slate-300 opacity-95">
                    <input value="${sub}" oninput="locations[${i}].sublocations[${si}]=this.value" class="w-full p-2 text-sm rounded-lg border focus:outline-none focus:ring-2 focus:ring-slate-300" placeholder="Sub-location (e.g., Desks, Floor)">
                    <button onclick="removeSublocation('${loc.id}', ${si})" class="px-3 bg-red-100/50 hover:bg-red-100 text-red-500 rounded-lg font-bold transition-colors">X</button>
                    </div>
                    `).join('')}
                    <button onclick="addSublocation('${loc.id}')" class="ml-4 text-xs font-bold text-slate-500 hover:text-slate-800 uppercase tracking-widest">+ Add Sub-location</button>
                    </div>

                    <div class="grid grid-cols-5 gap-4">
                    ${loc.photos.map((p, pi) => `<div class="relative rounded-xl border aspect-square overflow-hidden"><img src="${p}" class="w-full h-full object-cover"><button onclick="removePhoto('${loc.id}', ${pi})" class="absolute top-1 right-1 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs">X</button></div>`).join('')}
                    <label class="cursor-pointer border-2 border-dashed rounded-xl flex items-center justify-center font-bold min-h-24 hover:bg-white text-slate-500 transition-colors">+ Photo<input type="file" class="hidden" accept="image/*" multiple onchange="handlePhotoUpload(event, '${loc.id}')"></label>
                    </div>
                </div>`).join('');
        };

        const handlePhotoUpload = (e, locId) => {
            const loc = locations.find(l => l.id === locId);
            if (!loc) return;
            Array.from(e.target.files).forEach(f => {
                const r = new FileReader();
                r.onload = ev => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 800; canvas.height = (img.height * 800) / img.width; ctx.drawImage(img, 0, 0, canvas.width, canvas.height); loc.photos.push(canvas.toDataURL('image/jpeg', 0.7)); renderLocations(); }; img.src = ev.target.result; };
                r.readAsDataURL(f);
            });
        };

        async function carregarRelatorioParaEdicao(id) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?id=eq.${id}&limit=1`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                if (!data || data.length === 0) return window.location.href = 'lista.html';

                const rep = data[0];
                $('page-title').innerText = 'Edit Report'; 
                $('report-building').value = rep.building || ''; 
                $('employee-name').value = rep.employeename || '';
                $('report-date').value = rep.date || ''; 
                $('report-summary').value = rep.summary || gerarTextoResumoPadrao(rep.employeename);
                selecionarPeriodo(rep.period || null); 
                selecionarOpcaoPDF(rep.pdfdisplayoption || null);
                locations = rep.locations || []; 
                locations.forEach(l => l.sublocations = l.sublocations || []); 
                resumoFoiEditadoManual = true; 
                renderLocations();
            } catch(err) { alert('Error loading report: ' + err.message); }
        }

        async function salvarRelatorio() {
            const b = $('report-building').value.trim(), e = $('employee-name').value.trim(), d = $('report-date').value, s = $('report-summary').value.trim();
            if (!b || !e || !d) return alert('Please fill in Building, Employee, and Date.');
            if (!selectedPeriod) return alert('Please select the Report Type (Daily, Weekly, Monthly).');
            if (!selectedPdfDisplayOption) return alert('Please select what will appear in the PDF.');

            const fullProfile = `${loggedFullName} - ${loggedRole}`;

            const data = {
                staff: fullProfile, 
                employeename: e, 
                building: b, 
                date: d, 
                period: selectedPeriod, 
                pdfdisplayoption: selectedPdfDisplayOption, 
                summary: s, 
                locations: locations
            };

            const btnSave = document.querySelector('button[onclick="salvarRelatorio()"]');
            const txtOriginal = btnSave.innerText;
            btnSave.innerText = "⏳ Saving..."; btnSave.disabled = true;

            try {
                let url = `${SUPABASE_URL}/rest/v1/reports`;
                let method = 'POST';
                let headers = { 
                    'apikey': SUPABASE_ANON_KEY, 
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                };

                if (editId) {
                    url += `?id=eq.${editId}`;
                    method = 'PATCH';
                }

                const res = await fetch(url, {
                    method,
                    headers,
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error(await res.text());
                window.location.href = 'lista.html';
            } catch(err) { 
                alert('Error saving: ' + err.message);
                btnSave.innerText = txtOriginal; btnSave.disabled = false;
            }
        }

        /* ===== NOVA FUNÇÃO GENIAL PARA GERAR O PDF DIRETAMENTE ===== */
        async function gerarPDFDireto() {
            const b = $('report-building').value.trim() || 'Not provided';
            const e = $('employee-name').value.trim() || '';
            const d = $('report-date').value || '';
            const s = $('report-summary').value.trim() || '';

            if (!e || !b) {
                alert('Please fill in Building and Employee Name to generate the PDF.');
                return;
            }

            const btn = $('btn-pdf-direto');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Generating..."; 
            btn.disabled = true;

            try {
                const staffGeradorPDF = `${loggedFullName} - ${loggedRole}`;
                const doc = new window.jspdf.jsPDF(); 
                let y = 20;

                const corVerde = [84, 124, 68]; 
                const corDado = [30, 30, 30]; 
                const corTextoLiso = [80, 80, 80]; 

                const getLogo = () => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = 'logo.png'; });
                const logoImg = await getLogo();

                if (logoImg) {
                    const maxW = 40, maxH = 25;
                    let w = logoImg.width, h = logoImg.height;
                    if (w > h) { h = h * (maxW / w); w = maxW; } else { w = w * (maxH / h); h = maxH; }
                    doc.addImage(logoImg, 'PNG', 15, y - 5, w, h);
                }

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(26);
                doc.setTextColor(...corVerde);
                doc.text('CLEANING REPORT', 195, y + 10, { align: 'right' });

                y += 30; 

                doc.setDrawColor(...corVerde);
                doc.setLineWidth(0.6);
                doc.line(15, y, 195, y);
                y += 12;

                doc.setFontSize(12);
                const addInfo = (lbl, valor, posY) => {
                    doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                    doc.text(lbl, 15, posY);
                    if (valor) {
                        doc.setFont('helvetica', 'normal'); doc.setTextColor(...corDado);
                        doc.text(valor, 60, posY);
                    }
                };

                addInfo('Prepared by:', staffGeradorPDF, y); y += 8;
                addInfo('Cleaning Staff:', e, y); y += 8;

                if (selectedPdfDisplayOption === 'date' || selectedPdfDisplayOption === 'both') {
                    addInfo('Date:', d ? d.split('-').reverse().join('/') : '', y); y += 8;
                }
                if (selectedPdfDisplayOption === 'period' || selectedPdfDisplayOption === 'both') {
                    addInfo('Report Type:', selectedPeriod || 'Daily', y); y += 8;
                }

                y += 8; 

                doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                doc.text('Summary of Work', 15, y); y += 6; 

                const textoPadraoResumo = `Cleaning staff member ${e || '[employee name]'} carried out cleaning tasks in the following areas using appropriate machinery and equipment. The work included floor cleaning and dust removal with the machine.`;
                const txtResumo = s || textoPadraoResumo;

                doc.setFontSize(12); doc.setFont('helvetica', 'normal'); 
                const splitS = doc.splitTextToSize(txtResumo, 160);
                const boxH = splitS.length * 6 + 10;

                doc.setFillColor(248, 249, 250); 
                doc.setDrawColor(220, 220, 220); 
                doc.setLineWidth(0.3);
                doc.roundedRect(15, y, 180, boxH, 2, 2, 'FD');

                doc.setTextColor(...corTextoLiso);
                doc.text(splitS, 20, y + 8);
                y += boxH + 15; 

                if (y > 250) { doc.addPage(); y = 20; }

                doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                doc.text('Building / Property:', 15, y);

                y += 8;
                doc.setFontSize(14); doc.setFont('helvetica', 'normal'); doc.setTextColor(...corDado);
                doc.text(b, 15, y);

                y += 15; 

                doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                doc.text('Locations Cleaned:', 15, y); y += 10;

                if (!locations.length) { 
                    doc.setFontSize(12); doc.setFont('helvetica', 'normal'); doc.setTextColor(...corDado);
                    doc.text('No areas attached.', 15, y); y += 8; 
                } else { 
                    locations.forEach(loc => { 
                        if(y>275) { doc.addPage(); y = 20; } 

                        doc.setFillColor(...corVerde); 
                        doc.circle(16, y - 1.5, 1.2, 'F'); 

                        doc.setTextColor(...corDado); doc.setFont('helvetica', 'normal'); doc.setFontSize(12); 
                        doc.text(loc.name || 'Unnamed location', 22, y); 
                        y += 8; 

                        if (loc.sublocations && loc.sublocations.length > 0) {
                            doc.setTextColor(110, 110, 110); 
                            doc.setFontSize(11);
                            loc.sublocations.forEach(sub => {
                                if (sub.trim() !== '') {
                                    if(y>275) { doc.addPage(); y = 20; } 
                                    doc.text(`- ${sub}`, 26, y);
                                    y += 6;
                                }
                            });
                            y += 2; 
                        }
                    }); 
                }

                const totalFotos = locations.reduce((a, l) => a + l.photos.length, 0);
                if (totalFotos > 0) {
                    doc.addPage(); y = 20;
                    doc.setFontSize(22); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                    doc.text('Photographic Evidence', 15, y); y += 15;

                    locations.forEach(loc => {
                        if (!loc.photos.length) return;
                        if(y>250){doc.addPage();y=20;}

                        doc.setFontSize(14); doc.setFont('helvetica', 'normal');
                        doc.setFillColor(...corVerde); doc.rect(15, y - 4, 2, 5, 'F'); 
                        doc.setTextColor(...corDado); doc.text(loc.name || 'Unnamed location', 20, y); 
                        y += 10;

                        let x = 15; const imgSize = 55; const espaco = 6;

                        loc.photos.forEach(img => {
                            if (x + imgSize > 195) { x = 15; y += imgSize + 15; }
                            if (y + imgSize > 275) { doc.addPage(); y = 20; x = 15; }

                            doc.setDrawColor(210, 210, 210);
                            doc.setLineWidth(0.4);
                            doc.rect(x - 0.5, y - 0.5, imgSize + 1, imgSize + 1);

                            try { doc.addImage(img, 'JPEG', x, y, imgSize, imgSize); } catch(e){} 
                            x += imgSize + espaco;
                        });
                        y += imgSize + 15;
                    });
                }

                const nomeSanitizado = e.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30) || 'Report';
                const dataSanitizada = d ? d.replace(/-/g, '') : 'no_date';
                const periodFinal = selectedPeriod || 'Daily';
                
                doc.save(`Cleaning_Report_${nomeSanitizado}_${periodFinal}_${dataSanitizada}.pdf`);
            } catch(err) {
                alert('Error generating PDF: ' + err.message);
            }

            btn.innerHTML = txtOriginal; 
            btn.disabled = false;
        }
    </script>
</body>
</html>
