<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu - West End Cleaning</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen">

    <div class="bg-white shadow-sm border-b-4 border-[#547C44]">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-12 object-contain" onerror="this.style.display='none'">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">Main Dashboard</h2>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-0.5">West End System</p>
                </div>
            </div>
            <button onclick="logout()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition-colors border border-slate-200">Logout</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-6 mt-10">

        <div class="bg-[#547C44] text-white p-8 rounded-3xl shadow-lg mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-3xl font-black mb-1">Welcome,</h1>
                <p id="user-fullname" class="text-xl font-bold opacity-90"></p>
                <p id="user-role" class="text-sm font-medium uppercase tracking-widest mt-1 opacity-75 bg-white/20 inline-block px-3 py-1 rounded-lg"></p>
            </div>
            <div class="bg-white/10 px-5 py-3 rounded-2xl border border-white/20 backdrop-blur-sm">
                <p class="text-xs uppercase tracking-widest font-bold opacity-80 mb-1">Current Date</p>
                <p id="current-date" class="font-bold text-lg"></p>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 px-2">
            <h3 class="text-lg font-bold text-slate-800">Quick Access</h3>
            <button onclick="openMenuManager()" id="btn-manage-menu" class="hidden px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Manage Menu
            </button>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <p class="text-slate-400 text-center py-10 col-span-4">Loading menu...</p>
        </div>
    </div>

    <!-- MODAL: Menu Manager (Admin) -->
    <div id="modal-menu-manager" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-start justify-center z-50 p-4 pt-8 overflow-y-auto">
        <div class="bg-white p-8 rounded-3xl w-full max-w-3xl shadow-2xl border border-slate-100 mb-8">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-2xl font-black text-slate-800">Menu Manager</h3>
                    <p class="text-sm text-slate-500">Add, edit or remove menu items. Only admins can see this panel.</p>
                </div>
                <button onclick="closeMenuManager()" class="text-slate-400 hover:text-slate-800 font-bold text-xl px-2">X</button>
            </div>

            <!-- Admin Key Auth -->
            <div id="menu-admin-auth" class="bg-red-50 p-5 rounded-xl border border-red-200 mb-4 flex flex-col gap-3">
                <label class="text-xs font-bold text-red-500 uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Master Key Required
                </label>
                <div class="flex gap-2">
                    <input type="password" id="menu-admin-key" class="flex-1 p-3 bg-white border border-red-300 rounded-xl focus:outline-none focus:border-red-500" placeholder="Enter Master Key">
                    <button onclick="unlockMenuManager()" class="px-6 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors">Unlock</button>
                </div>
            </div>

            <!-- Menu Items List (hidden until auth) -->
            <div id="menu-items-list" class="hidden">
                <div class="flex gap-3 mb-4">
                    <button onclick="openAddMenuItem()" class="px-5 py-2.5 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl text-sm transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Item
                    </button>
                    <button onclick="openManageProfiles()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Manage Profiles
                    </button>
                </div>
                <div id="admin-menu-items" class="space-y-3 max-h-[50vh] overflow-y-auto pr-2">
                    <!-- items go here -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Add/Edit Menu Item -->
    <div id="modal-add-item" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100">
            <h3 id="item-modal-title" class="text-xl font-black text-slate-800 mb-1">Add Menu Item</h3>
            <p class="text-sm text-slate-500 mb-6">Configure the menu button.</p>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">Title</label>
                    <input type="text" id="item-title" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="e.g. New Report">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">Description</label>
                    <input type="text" id="item-desc" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="e.g. Create a new cleaning report">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">Icon (emoji or text)</label>
                    <input type="text" id="item-icon" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="e.g. + or 📄 or 🔧">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">URL / Page</label>
                    <input type="text" id="item-url" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="e.g. reports.html">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">Allowed Roles</label>
                    <div class="flex flex-wrap gap-2" id="roles-checkboxes">
                        <label class="flex items-center gap-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold cursor-pointer hover:bg-slate-100">
                            <input type="checkbox" value="Cleaner" class="role-cb"> Cleaner
                        </label>
                        <label class="flex items-center gap-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold cursor-pointer hover:bg-slate-100">
                            <input type="checkbox" value="Supervisor" class="role-cb"> Supervisor
                        </label>
                        <label class="flex items-center gap-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold cursor-pointer hover:bg-slate-100">
                            <input type="checkbox" value="Area Manager" class="role-cb"> Area Manager
                        </label>
                        <label class="flex items-center gap-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold cursor-pointer hover:bg-slate-100">
                            <input type="checkbox" value="Support Manager" class="role-cb"> Support Manager
                        </label>
                        <label class="flex items-center gap-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold cursor-pointer hover:bg-slate-100">
                            <input type="checkbox" value="IT System Admin" class="role-cb"> IT System Admin
                        </label>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">Order (position)</label>
                    <input type="number" id="item-order" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="1" value="1" min="1">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block">Background Color</label>
                    <div class="flex gap-2 flex-wrap">
                        <button type="button" onclick="selectColor(this, 'white')" class="color-btn w-8 h-8 rounded-lg bg-white border-2 border-slate-300 hover:border-[#547C44] transition-colors shadow-sm"></button>
                        <button type="button" onclick="selectColor(this, 'slate-800')" class="color-btn w-8 h-8 rounded-lg bg-slate-800 border-2 border-slate-600 hover:border-[#547C44] transition-colors"></button>
                        <button type="button" onclick="selectColor(this, 'green-700')" class="color-btn w-8 h-8 rounded-lg bg-green-700 border-2 border-green-600 hover:border-[#547C44] transition-colors"></button>
                        <button type="button" onclick="selectColor(this, 'blue-600')" class="color-btn w-8 h-8 rounded-lg bg-blue-600 border-2 border-blue-500 hover:border-[#547C44] transition-colors"></button>
                        <button type="button" onclick="selectColor(this, 'purple-600')" class="color-btn w-8 h-8 rounded-lg bg-purple-600 border-2 border-purple-500 hover:border-[#547C44] transition-colors"></button>
                        <button type="button" onclick="selectColor(this, 'orange-500')" class="color-btn w-8 h-8 rounded-lg bg-orange-500 border-2 border-orange-400 hover:border-[#547C44] transition-colors"></button>
                        <button type="button" onclick="selectColor(this, 'red-600')" class="color-btn w-8 h-8 rounded-lg bg-red-600 border-2 border-red-500 hover:border-[#547C44] transition-colors"></button>
                    </div>
                </div>
            </div>

            <input type="hidden" id="item-edit-id" value="">

            <div class="flex gap-3 mt-6">
                <button onclick="closeAddMenuItem()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-colors">Cancel</button>
                <button onclick="saveMenuItem()" class="flex-1 py-3 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl shadow-md transition-colors">Save Item</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Manage Profiles -->
    <div id="modal-profiles" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-2xl shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-2xl font-black text-slate-800">Profile Management</h3>
                    <p class="text-sm text-slate-500">Edit roles or remove users.</p>
                </div>
                <button onclick="closeProfilesModal()" class="text-slate-400 hover:text-slate-800 font-bold text-xl px-2">X</button>
            </div>

            <div id="profiles-list" class="max-h-[50vh] overflow-y-auto pr-2 space-y-3">
                <!-- profiles go here -->
            </div>
        </div>
    </div>

    <script>
        // ===== SUPABASE CONFIG =====
        const SUPABASE_URL = 'https://wkndzjnqypsyluhgrdil.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbmR6am5xeXBzeWx1aGdyZGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzU5MTQsImV4cCI6MjA5NTA1MTkxNH0.6W9dsBVCeLzT3EIHyQ5ZFmQhEOyj586K9po4cj9wJeA';
        const MASTER_KEY = "admin123";

        const $ = id => document.getElementById(id);
        let loggedUser = null, loggedFullName = null, loggedRole = null;

        window.onload = function() {
            loggedUser = localStorage.getItem('loggedUser');
            if (!loggedUser) return window.location.href = 'index.html';

            loggedFullName = localStorage.getItem('loggedFullName') || loggedUser;
            loggedRole = localStorage.getItem('loggedRole') || 'Staff';

            $('user-fullname').innerText = loggedFullName;
            $('user-role').innerText = loggedRole;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            $('current-date').innerText = new Date().toLocaleDateString('en-US', options);

            // Show Manage Menu button only for IT Admin
            if (loggedRole === 'IT System Admin') {
                $('btn-manage-menu').classList.remove('hidden');
            }

            loadMenuItems();
            loadProfiles();
        };

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        /* ===== MENU ITEMS ===== */
        async function loadMenuItems() {
            const grid = $('menu-grid');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/menu_items?order=order.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                let items = await res.json();

                // Filter by role
                items = items.filter(item => {
                    const roles = item.roles || [];
                    return roles.includes(loggedRole);
                });

                if (!items.length) {
                    grid.innerHTML = `<p class="text-slate-400 text-center py-10 col-span-4">No menu items available for your role.</p>`;
                    return;
                }

                grid.innerHTML = items.map(item => `
                    <button onclick="window.location.href='${item.url || '#'}'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                        <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center font-bold text-2xl mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors">${item.icon || '+'}</div>
                        <h3 class="text-xl font-black text-slate-800 mb-2">${item.title || 'Item'}</h3>
                        <p class="text-slate-500 font-medium text-sm">${item.desc || ''}</p>
                    </button>
                `).join('');
            } catch(e) {
                // Se não existirem itens, cria os padrões
                await createDefaultMenuItems();
                loadMenuItems();
            }
        }

        async function createDefaultMenuItems() {
            const defaults = [
                { id: 'reports', title: 'New Report', desc: 'Create and fill a new cleaning report with photos.', icon: '+', url: 'reports.html', roles: JSON.stringify(['Cleaner','Supervisor','Area Manager','Support Manager','IT System Admin']), order: 1 },
                { id: 'lista', title: 'Saved Reports', desc: 'View, edit or export past reports to PDF.', icon: '📄', url: 'lista.html', roles: JSON.stringify(['Supervisor','Area Manager','Support Manager','IT System Admin']), order: 2 },
                { id: 'schedule', title: 'Cleaning Schedule', desc: 'Access, build and print official staff schedules.', icon: '📅', url: 'schedule.html', roles: JSON.stringify(['Supervisor','Area Manager','Support Manager','IT System Admin']), order: 3 },
                { id: 'menu-manager', title: 'Menu Manager', desc: 'Admin access to manage menu items and profiles.', icon: '🔧', url: '#', roles: JSON.stringify(['IT System Admin']), order: 4 },
            ];
            for (const item of defaults) {
                await fetch(`${SUPABASE_URL}/rest/v1/menu_items`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                    body: JSON.stringify(item)
                });
            }
        }

        /* ===== MENU MANAGER (ADMIN) ===== */
        function openMenuManager() {
            $('menu-admin-auth').classList.remove('hidden');
            $('menu-items-list').classList.add('hidden');
            $('modal-menu-manager').classList.remove('hidden');
        }

        function closeMenuManager() {
            $('modal-menu-manager').classList.add('hidden');
        }

        function unlockMenuManager() {
            const key = $('menu-admin-key').value;
            if (key !== MASTER_KEY) return alert('Incorrect Master Key!');
            $('menu-admin-auth').classList.add('hidden');
            $('menu-items-list').classList.remove('hidden');
            loadAdminMenuItems();
        }

        async function loadAdminMenuItems() {
            const container = $('admin-menu-items');
            container.innerHTML = '<p class="text-center text-slate-400 py-4">Loading...</p>';
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/menu_items?order=order.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const items = await res.json();
                if (!items.length) { container.innerHTML = '<p class="text-center text-slate-400 py-4">No items yet.</p>'; return; }
                container.innerHTML = items.map(item => {
                    let roles = [];
                    try { roles = JSON.parse(item.roles); } catch(e) { roles = item.roles || []; }
                    return `
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl w-10 text-center">${item.icon || '+'}</span>
                            <div>
                                <h4 class="font-bold text-slate-800">${item.title || 'Item'}</h4>
                                <p class="text-xs text-slate-500">${item.url || '#'} • Order: ${item.order || 1}</p>
                                <div class="flex flex-wrap gap-1 mt-1">
                                    ${roles.map(r => `<span class="text-[10px] px-2 py-0.5 bg-slate-200 text-slate-600 rounded-full font-bold">${r}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-shrink-0">
                            <button onclick="editMenuItem('${item.id}')" class="px-3 py-2 bg-blue-100 hover:bg-blue-200 text-blue-600 font-bold rounded-lg text-xs transition-colors">Edit</button>
                            <button onclick="deleteMenuItem('${item.id}')" class="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-600 font-bold rounded-lg text-xs transition-colors">Delete</button>
                        </div>
                    </div>`;
                }).join('');
            } catch(e) { container.innerHTML = `<p class="text-red-500 text-center">Error: ${e.message}</p>`; }
        }

        function selectColor(btn, color) {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-[#547C44]', 'border-4'));
            btn.classList.add('border-[#547C44]', 'border-4');
            btn.dataset.color = color;
        }

        function openAddMenuItem(editId) {
            $('item-edit-id').value = editId || '';
            $('item-title').value = '';
            $('item-desc').value = '';
            $('item-icon').value = '';
            $('item-url').value = '';
            $('item-order').value = '1';
            $('item-modal-title').innerText = editId ? 'Edit Menu Item' : 'Add Menu Item';
            document.querySelectorAll('.role-cb').forEach(cb => cb.checked = false);
            document.querySelectorAll('.color-btn').forEach(b => { b.classList.remove('border-[#547C44]', 'border-4'); });
            $('modal-add-item').classList.remove('hidden');
        }

        function closeAddMenuItem() {
            $('modal-add-item').classList.add('hidden');
        }

        async function editMenuItem(id) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/menu_items?id=eq.${id}&limit=1`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const items = await res.json();
            if (!items.length) return;
            const item = items[0];
            $('item-edit-id').value = id;
            $('item-title').value = item.title || '';
            $('item-desc').value = item.desc || '';
            $('item-icon').value = item.icon || '';
            $('item-url').value = item.url || '';
            $('item-order').value = item.order || 1;
            $('item-modal-title').innerText = 'Edit Menu Item';

            // Parse roles
            let roles = [];
            try { roles = JSON.parse(item.roles); } catch(e) { roles = item.roles || []; }
            document.querySelectorAll('.role-cb').forEach(cb => { cb.checked = roles.includes(cb.value); });
            $('modal-add-item').classList.remove('hidden');
        }

        async function saveMenuItem() {
            const id = $('item-edit-id').value;
            const title = $('item-title').value.trim();
            const desc = $('item-desc').value.trim();
            const icon = $('item-icon').value.trim();
            const url = $('item-url').value.trim();
            const order = parseInt($('item-order').value) || 1;
            const selectedRoles = Array.from(document.querySelectorAll('.role-cb:checked')).map(cb => cb.value);

            if (!title || !url) return alert('Title and URL are required.');

            const data = {
                title, desc, icon, url, order,
                roles: JSON.stringify(selectedRoles)
            };

            try {
                if (id) {
                    // Update existing
                    await fetch(`${SUPABASE_URL}/rest/v1/menu_items?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    // Create new
                    data.id = 'item_' + Date.now();
                    await fetch(`${SUPABASE_URL}/rest/v1/menu_items`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                        body: JSON.stringify(data)
                    });
                }
                closeAddMenuItem();
                loadAdminMenuItems();
                loadMenuItems();
            } catch(e) { alert('Error saving: ' + e.message); }
        }

        async function deleteMenuItem(id) {
            if (!confirm('Delete this menu item?')) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/menu_items?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                loadAdminMenuItems();
                loadMenuItems();
            } catch(e) { alert('Error deleting: ' + e.message); }
        }

        /* ===== PROFILES (inside Menu Manager) ===== */
        function openManageProfiles() {
            $('modal-profiles').classList.remove('hidden');
        }

        function closeProfilesModal() {
            $('modal-profiles').classList.add('hidden');
        }

        async function loadProfiles() {
            const container = $('profiles-list');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/users?order=fullname.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const users = await res.json();
                if (!users.length) { container.innerHTML = '<p class="text-slate-400 text-center py-4">No users found.</p>'; return; }
                container.innerHTML = users.map(u => `
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-slate-800">${u.fullname || u.id} <span class="text-xs font-normal text-slate-500">@${u.id}</span></h4>
                            <select id="role-${u.id}" onchange="updateRole('${u.id}')" class="mt-1 bg-white border border-slate-300 text-slate-700 text-xs rounded px-2 py-1 font-bold outline-none">
                                <option value="Cleaner" ${u.role==='Cleaner'?'selected':''}>Cleaner</option>
                                <option value="Supervisor" ${u.role==='Supervisor'?'selected':''}>Supervisor</option>
                                <option value="Area Manager" ${u.role==='Area Manager'?'selected':''}>Area Manager</option>
                                <option value="Support Manager" ${u.role==='Support Manager'?'selected':''}>Support Manager</option>
                                <option value="IT System Admin" ${u.role==='IT System Admin'?'selected':''}>IT System Admin</option>
                            </select>
                        </div>
                        <button onclick="deleteProfile('${u.id}')" class="bg-red-100 text-red-600 hover:bg-red-200 font-bold px-4 py-2 rounded-lg text-sm transition-colors">Delete</button>
                    </div>
                `).join('');
            } catch(e) { container.innerHTML = `<p class="text-red-500">Error: ${e.message}</p>`; }
        }

        async function updateRole(username) {
            const newRole = $(`role-${username}`).value;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${username}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: newRole })
                });
                if (username === loggedUser) {
                    localStorage.setItem('loggedRole', newRole);
                    $('user-role').innerText = newRole;
                    loadMenuItems();
                }
            } catch(e) { alert('Error updating role: ' + e.message); }
        }

        async function deleteProfile(username) {
            if (!confirm(`Delete profile @${username}?`)) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${username}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                loadProfiles();
            } catch(e) { alert('Error deleting: ' + e.message); }
        }
    </script>
</body>
</html>
