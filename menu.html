<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: rgba(255,255,255,0.1);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #4361ee;
            color: #fff;
        }
        .btn-primary:hover { background: #3730a3; }
        .btn-danger {
            background: #ef233c;
            color: #fff;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.3); }
        .user-info {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .menu-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: #4361ee;
            background: rgba(255,255,255,0.12);
        }
        .menu-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .menu-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .menu-desc {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            line-height: 1.5;
        }
        /* Modal Login */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 400px;
            max-width: 90%;
            text-align: center;
        }
        .modal-content h2 { margin-bottom: 25px; font-size: 24px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4361ee;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons .btn { flex: 1; }
        .error-msg {
            background: rgba(239,35,60,0.2);
            color: #ef233c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏠 Menu Principal</h1>
        <div class="header-right" id="headerRight">
            <button class="btn btn-primary" onclick="showLoginModal()">Entrar</button>
        </div>
    </div>

    <div class="container">
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>🔐 Login</h2>
            <div class="error-msg" id="loginError">Credenciais inválidas</div>
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" placeholder="Seu nome de usuário">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="Sua senha">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeLoginModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="doLogin()">Login</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Config
        const SB_URL = 'https://wkndzjnqypsyluhgrdil.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbmR6am5xeXBzeWx1aGdyZGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzU5MTQsImV4cCI6MjA5NTA1MTkxNH0.6W9dsBVCeLzT3EIHyQ5ZFmQhEOyj586K9po4cj9wJeA';

        // Menu fixo (visível para todos)
        const menuItems = [
            { id: 'r1', icon: '📋', title: 'Meus Relatórios', desc: 'Ver e gerenciar todos os relatórios' },
            { id: 'r2', icon: '➕', title: 'Criar Relatório', desc: 'Criar um novo relatório de limpeza' },
            { id: 'r3', icon: '👥', title: 'Gerenciar Usuários', desc: 'Gerenciar usuários do sistema', roles: ['Admin', 'IT System Admin'] },
            { id: 'r4', icon: '⚙️', title: 'Configurações', desc: 'Configurações do sistema', roles: ['IT System Admin'] }
        ];

        // Verificar sessão
        let currentUser = null;
        const session = localStorage.getItem('session');
        if (session) {
            currentUser = JSON.parse(session);
        }

        // Render menu
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = menuItems.map(item => {
                const disabled = item.roles && !item.roles.includes(currentUser?.role);
                return `
                    <div class="menu-card" style="${disabled ? 'opacity:0.5;cursor:not-allowed' : ''}" 
                         onclick="${disabled ? '' : `window.location='${item.url || '#'}'`}">
                        <div class="menu-icon">${item.icon}</div>
                        <div class="menu-title">${item.title}</div>
                        <div class="menu-desc">${item.desc}</div>
                    </div>
                `;
            }).join('');
        }

        // Header buttons
        function updateHeader() {
            const right = document.getElementById('headerRight');
            if (currentUser) {
                right.innerHTML = `
                    <span class="user-info">👤 ${currentUser.name} (${currentUser.role})</span>
                    <button class="btn btn-danger" onclick="logout()">Sair</button>
                `;
            } else {
                right.innerHTML = `<button class="btn btn-primary" onclick="showLoginModal()">Entrar</button>`;
            }
        }

        // Login functions
        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('loginError').style.display = 'none';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        async function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            
            if (!user || !pass) {
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${SB_URL}/rest/v1/users?fullname=eq.${encodeURIComponent(user)}&pass=eq.${pass}`, {
                    headers: {
                        'apikey': SB_KEY,
                        'Authorization': `Bearer ${SB_KEY}`
                    }
                });
                const data = await res.json();
                
                if (data && data.length > 0) {
                    currentUser = { id: data[0].id, name: data[0].fullname, role: data[0].role };
                    localStorage.setItem('session', JSON.stringify(currentUser));
                    closeLoginModal();
                    updateHeader();
                    renderMenu();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (e) {
                console.error('Login error:', e);
                // Fallback para localStorage
                const stored = localStorage.getItem('users');
                if (stored) {
                    const users = JSON.parse(stored);
                    const found = users.find(u => u.fullname === user && u.pass === pass);
                    if (found) {
                        currentUser = { id: found.id, name: found.fullname, role: found.role };
                        localStorage.setItem('session', JSON.stringify(currentUser));
                        closeLoginModal();
                        updateHeader();
                        renderMenu();
                    } else {
                        document.getElementById('loginError').style.display = 'block';
                    }
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('session');
            updateHeader();
            renderMenu();
        }

        // Iniciar
        updateHeader();
        renderMenu();
    </script>
</body>
</html>
