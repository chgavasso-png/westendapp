<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu - West End Cleaning</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen">

    <div class="bg-white shadow-sm border-b-4 border-[#547C44]">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-12 object-contain" onerror="this.style.display='none'">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">Main Dashboard</h2>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-0.5">West End System</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="relative" id="settings-wrapper">
                    <button onclick="toggleSettingsMenu()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors" title="Settings">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                    <div id="settings-menu" class="hidden absolute right-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-slate-200 py-2 z-50">
                        <button onclick="openProfilesModal()" class="w-full px-4 py-2.5 flex items-center gap-3 hover:bg-slate-50 transition-colors text-left">
                            <span class="w-8 h-8 bg-slate-800 text-white rounded-lg flex items-center justify-center text-sm">🔒</span>
                            <span>
                                <span class="block font-bold text-slate-800 text-sm">Manage Profiles</span>
                                <span class="block text-xs text-slate-500">Users, passwords and roles</span>
                            </span>
                        </button>
                        <div class="border-t border-slate-100 my-1"></div>
                        <button onclick="logout()" class="w-full px-4 py-2.5 flex items-center gap-3 hover:bg-red-50 transition-colors text-left">
                            <span class="w-8 h-8 bg-red-100 text-red-600 rounded-lg flex items-center justify-center text-sm">↪</span>
                            <span class="font-bold text-red-600 text-sm">Logout</span>
                        </button>
                    </div>
                </div>
                <button onclick="logout()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition-colors border border-slate-200">Logout</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-6 mt-10">

        <!-- Welcome Card -->
        <div class="bg-[#547C44] text-white p-8 rounded-3xl shadow-lg mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-3xl font-black mb-1">Welcome,</h1>
                <p id="user-fullname" class="text-xl font-bold opacity-90"></p>
                <p id="user-role" class="text-sm font-medium uppercase tracking-widest mt-1 opacity-75 bg-white/20 inline-block px-3 py-1 rounded-lg"></p>
            </div>
            <div class="bg-white/10 px-5 py-3 rounded-2xl border border-white/20 backdrop-blur-sm">
                <p class="text-xs uppercase tracking-widest font-bold opacity-80 mb-1">Current Date</p>
                <p id="current-date" class="font-bold text-lg"></p>
            </div>
        </div>

        <h3 class="text-lg font-bold text-slate-800 mb-4 px-2">Quick Access</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <button onclick="window.location.href='reports.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center font-bold text-2xl mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors">+</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">New Report</h3>
                <p class="text-slate-500 font-medium text-sm">Create and fill a new cleaning report with photos.</p>
            </button>

            <button onclick="window.location.href='building-tasks.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors">🏢</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">Task Descriptions</h3>
                <p class="text-slate-500 font-medium text-sm">View, edit, and print official building task allocations.</p>
            </button>

            <button onclick="window.location.href='schedule.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors">📅</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">Cleaning Schedule</h3>
                <p class="text-slate-500 font-medium text-sm">Access, build and print official staff schedules.</p>
            </button>

            <button onclick="window.location.href='invoices.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-[#547C44] text-white rounded-2xl flex items-center justify-center mb-4 shadow-inner font-bold text-2xl">£</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">Invoices</h3>
                <p class="text-slate-500 font-medium text-sm">Create and manage service invoices with items and totals.</p>
            </button>

            <button onclick="window.location.href='certificates.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors font-bold text-xl" title="Certificates">🎓</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">Certificates</h3>
                <p class="text-slate-500 font-medium text-sm">Create and print official training certificates.</p>
            </button>

            <button onclick="window.location.href='uhub-certificates.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors font-bold text-xl" title="UhUb Certificates">📜</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">UhUb Certificates</h3>
                <p class="text-slate-500 font-medium text-sm">Issue UhUb training certificates to employees (Supabase).</p>
            </button>

            <button onclick="window.location.href='ssop.html'" class="group bg-white p-6 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md hover:border-[#547C44] transition-all text-left flex flex-col h-full relative overflow-hidden">
                <div class="w-12 h-12 bg-slate-100 text-[#547C44] rounded-2xl flex items-center justify-center mb-4 shadow-inner group-hover:bg-[#547C44] group-hover:text-white transition-colors font-bold text-xl" title="SSOP">🛡️</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">SSOP</h3>
                <p class="text-slate-500 font-medium text-sm">Safety procedures to read, sign and send for signature via WhatsApp.</p>
            </button>

        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="modal-profiles" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-2xl shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-2xl font-black text-slate-800">System Configuration</h3>
                    <p class="text-sm text-slate-500">Edit users and manage global roles.</p>
                </div>
                <button onclick="closeProfilesModal()" class="text-slate-400 hover:text-slate-800 font-bold text-xl px-2">X</button>
            </div>

            <!-- Admin Auth -->
            <div id="admin-auth" class="bg-slate-50 p-6 rounded-xl border border-slate-200 mb-4 flex flex-col gap-3">
                <label class="text-xs font-bold text-red-500 uppercase tracking-widest">Master Key Required</label>
                <div class="flex gap-2">
                    <input type="password" id="admin-key" class="w-full p-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:border-red-500" placeholder="Enter Master Key to unlock list">
                    <button onclick="unlockProfiles()" class="px-6 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors">Unlock</button>
                </div>
            </div>

            <!-- Unlocked Content -->
            <div id="admin-list" class="hidden">

                <!-- Tabs -->
                <div class="flex gap-2 mb-6 border-b border-slate-200">
                    <button onclick="switchTab('users')" id="tab-users" class="px-4 py-2 font-bold text-sm border-b-2 border-[#547C44] text-[#547C44]">👥 Users</button>
                    <button onclick="switchTab('roles')" id="tab-roles" class="px-4 py-2 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">🏷️ Roles</button>
                </div>

                <!-- Tab Users -->
                <div id="content-users" class="tab-content">
                    <div class="max-h-[40vh] overflow-y-auto pr-2 space-y-3" id="profiles-container"></div>
                </div>

                <!-- Tab Roles -->
                <div id="content-roles" class="tab-content hidden">
                    <div class="mb-4 flex gap-2">
                        <input type="text" id="new-role-name" class="flex-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="New role name (e.g. Regional Manager)">
                        <button onclick="addNewRole()" class="px-6 bg-[#547C44] hover:bg-[#456638] text-white font-bold rounded-xl transition-colors">Add Role</button>
                    </div>
                    <div id="roles-container" class="space-y-2 max-h-[35vh] overflow-y-auto pr-2"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- MODULE SCRIPT FOR FIREBASE V9+ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSPim1j9yxA56AeWhWhdG_8TKzh_F-gZc",
            authDomain: "westend-c6992.firebaseapp.com",
            projectId: "westend-c6992",
            storageBucket: "westend-c6992.firebasestorage.app",
            messagingSenderId: "781546407326",
            appId: "1:781546407326:web:ed4126214f41498153428f",
            measurementId: "G-DEGC00501H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const MASTER_KEY = "admin123";
        const defaultRoles = ['Cleaner', 'Supervisor', 'Area Manager', 'Support Manager', 'IT System Admin'];
        let customRoles = [];

        window.onload = async function() {
            let loggedUser = localStorage.getItem('loggedUser');
            let fullName = localStorage.getItem('loggedFullName');
            let role = localStorage.getItem('loggedRole');

            if (!loggedUser) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('user-fullname').innerText = fullName || loggedUser;
            document.getElementById('user-role').innerText = role || 'Staff';

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

            // Tenta carregar as roles customizadas do BD global silenciosamente
            try {
                const rolesDoc = await getDoc(doc(db, "settings", "roles"));
                if (rolesDoc.exists() && rolesDoc.data().list) {
                    customRoles = rolesDoc.data().list;
                }
            } catch(e) {
                console.warn("Could not load custom roles initially", e);
            }
        };

        window.toggleSettingsMenu = function() {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('hidden');
        };

        window.logout = function() {
            localStorage.clear();
            window.location.href = 'index.html';
        };

        // Fecha o menu de configurações ao clicar fora
        document.addEventListener('click', function(e) {
            const wrapper = document.getElementById('settings-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('settings-menu').classList.add('hidden');
            }
        });

        /* --- ADMIN PROFILES LOGIC --- */
        window.openProfilesModal = function() {
            document.getElementById('admin-key').value = '';
            document.getElementById('admin-auth').classList.remove('hidden');
            document.getElementById('admin-list').classList.add('hidden');
            window.switchTab('users');
            document.getElementById('modal-profiles').classList.remove('hidden');
        };

        window.closeProfilesModal = function() {
            document.getElementById('modal-profiles').classList.add('hidden');
        };

        window.unlockProfiles = async function() {
            const key = document.getElementById('admin-key').value;
            if(key === MASTER_KEY) {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-list').classList.remove('hidden');

                // Força recarregar roles do banco de dados para garantir sync com outros admins
                try {
                    const rolesDoc = await getDoc(doc(db, "settings", "roles"));
                    if (rolesDoc.exists() && rolesDoc.data().list) {
                        customRoles = rolesDoc.data().list;
                    }
                } catch(e) {
                    console.error("Error reading roles", e);
                }

                window.renderRoles();
                await fetchProfiles();
            } else {
                alert("Incorrect Master Key!");
            }
        };

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('border-[#547C44]', 'text-[#547C44]');
                el.classList.add('border-transparent', 'text-slate-500');
            });
            document.getElementById('content-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('border-[#547C44]', 'text-[#547C44]');
            document.getElementById('tab-' + tab).classList.remove('border-transparent', 'text-slate-500');
        };

        async function fetchProfiles() {
            const container = document.getElementById('profiles-container');
            container.innerHTML = '<p class="text-center text-slate-500 py-4">Loading profiles...</p>';

            const allRoles = [...defaultRoles, ...customRoles];

            try {
                const snapshot = await getDocs(collection(db, "users"));
                let html = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const username = docSnap.id;
                    const fn = data.fullName || username;
                    const role = data.role || 'Cleaner';

                    let roleOptions = allRoles.map(r => `<option value="${r}" ${role===r?'selected':''}>${r}</option>`).join('');

                    html += `
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div>
                    <h4 class="font-bold text-slate-800 text-lg">${fn} <span class="text-xs font-normal text-slate-500 ml-1">(@${username})</span></h4>
                    <select id="role-${username}" onchange="updateRole('${username}')" class="mt-1 bg-white border border-slate-300 text-slate-700 text-xs rounded px-2 py-1 font-bold outline-none cursor-pointer">
                    ${roleOptions}
                    </select>
                    </div>
                    <button onclick="deleteProfile('${username}')" class="bg-red-100 text-red-600 hover:bg-red-200 font-bold px-4 py-2 rounded-lg text-sm transition-colors">Delete</button>
                    </div>
                    `;
                });
                if (!html) html = '<p class="text-center text-slate-400 py-4">No users found.</p>';
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = '<p class="text-center text-red-500">Error loading profiles: ' + e.message + '</p>';
            }
        }

        window.updateRole = async function(username) {
            const newRole = document.getElementById(`role-${username}`).value;
            try {
                await updateDoc(doc(db, "users", username), { role: newRole });

                if(username === localStorage.getItem('loggedUser')) {
                    localStorage.setItem('loggedRole', newRole);
                    document.getElementById('user-role').innerText = newRole;
                }
            } catch(e) {
                alert("Error updating role: " + e.message);
            }
        };

        window.deleteProfile = async function(username) {
            if(confirm(`Are you sure you want to permanently delete the profile for @${username}?`)) {
                try {
                    await deleteDoc(doc(db, "users", username));
                    fetchProfiles();
                } catch(e) {
                    alert("Error deleting: " + e.message);
                }
            }
        };

        /* --- ROLES MANAGEMENT --- */
        window.renderRoles = function() {
            const container = document.getElementById('roles-container');
            const allRoles = [...defaultRoles, ...customRoles];

            let html = `
                <div class="bg-slate-100 rounded-xl p-3 mb-4">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">📌 Default Roles (can't be deleted)</p>
                    <div class="flex flex-wrap gap-2">
                        ${defaultRoles.map(r => `<span class="bg-white px-3 py-1 rounded-lg text-sm font-bold text-slate-600 border border-slate-200">${r}</span>`).join('')}
                    </div>
                </div>
            `;

            if (customRoles.length > 0) {
                html += `
                    <div class="bg-red-50 rounded-xl p-3 mb-2">
                        <p class="text-xs font-bold text-red-500 uppercase tracking-widest mb-2">🗑️ Custom Roles</p>
                        <div class="flex flex-wrap gap-2">
                            ${customRoles.map((r) => `
                                <span class="bg-white px-3 py-1 rounded-lg text-sm font-bold text-slate-600 border border-slate-200 flex items-center gap-2">
                                    ${r}
                                    <button onclick="removeRole('${r}')" class="text-red-500 hover:text-red-700 font-bold ml-1">×</button>
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html || '<p class="text-center text-slate-400 py-4">No custom roles yet.</p>';
        };

        // Salvar papéis globalmente
        async function saveRolesToDB() {
            try {
                await setDoc(doc(db, "settings", "roles"), { list: customRoles });
            } catch (e) {
                console.error("Error saving roles to DB", e);
                alert("Roles foram salvos localmente, mas houve um erro no banco de dados.");
            }
        }

        window.addNewRole = async function() {
            const input = document.getElementById('new-role-name');
            const name = input.value.trim();

            if (!name) {
                alert('Enter a role name!');
                return;
            }

            const allRoles = [...defaultRoles, ...customRoles];
            if (allRoles.map(r => r.toLowerCase()).includes(name.toLowerCase())) {
                alert('This role already exists!');
                return;
            }

            customRoles.push(name);
            input.value = '';

            window.renderRoles();
            await saveRolesToDB();
            await fetchProfiles(); 
        };

        window.removeRole = async function(roleName) {
            if (confirm(`Delete the custom role '${roleName}'?`)) {
                customRoles = customRoles.filter(r => r !== roleName);
                window.renderRoles();
                await saveRolesToDB();
                await fetchProfiles();
            }
        };

    </script>
</body>
</html>
