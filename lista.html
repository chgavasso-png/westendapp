<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen pb-20">

    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="menu.html" class="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">Saved Reports</h2>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-widest mt-1">Logged as: <span id="logged-user-name" class="font-bold text-slate-700"></span></p>
                </div>
            </div>
            <a href="reports.html" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md transition-colors">+ New</a>
        </div>
    </div>

    <div class="max-w-5xl mx-auto p-6 space-y-4 mt-4" id="relatorios-container"></div>

    <script>
        // ===== SUPABASE CONFIG =====
        const SUPABASE_URL = 'https://wkndzjnqypsyluhgrdil.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbmR6am5xeXBzeWx1aGdyZGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzU5MTQsImV4cCI6MjA5NTA1MTkxNH0.6W9dsBVCeLzT3EIHyQ5ZFmQhEOyj586K9po4cj9wJeA';

        // Mantém a visualização de quem CRIO o report para exibir na lista da tela
        function formatarNomePerfil(nome) {
            if (!nome) return 'Unknown Profile';
            if (nome.includes('-')) return nome; 
            
            const n = nome.toLowerCase();
            if (n.includes('taynara')) return 'Taynara Gavasso - Support Manager';
            if (n.includes('marcia')) return 'Marcia Gavasso - Area Manager';
            if (n.includes('carlos')) return 'Carlos Henrique Gavasso Virissimo - IT System Admin';
            
            return nome + ' - Staff';
        }

        window.onload = function() {
            let loggedUser = localStorage.getItem('loggedUser');
            if (!loggedUser) return window.location.href = 'index.html';
            
            let fullName = localStorage.getItem('loggedFullName') || loggedUser;
            let role = localStorage.getItem('loggedRole') || 'Staff';
            document.getElementById('logged-user-name').innerText = `${fullName} | ${role}`;
            
            carregarLista();
        };

        async function carregarLista() {
            const container = document.getElementById('relatorios-container');
            container.innerHTML = '<div class="text-center p-8 text-slate-500 font-bold">Loading reports...</div>';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });

                if (!res.ok) throw new Error(await res.text());

                const db = await res.json();
                container.innerHTML = '';

                if (!db || db.length === 0) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center shadow-sm border border-slate-200 text-slate-500 font-bold">No reports saved in the system.</div>`;
                    return;
                }

                db.forEach(rep => {
                    let dataFormatada = rep.date ? rep.date.split('-').reverse().join('/') : 'No date';

                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 hover:shadow-md transition-all">
                        <div class="flex-1">
                            <div class="flex items-center gap-3">
                                <h3 class="text-lg font-extrabold text-slate-800">${rep.building || 'Unnamed building'}</h3>
                                <span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">${rep.period || 'Daily'}</span>
                            </div>
                            <p class="text-sm text-slate-500 mt-1"><strong>Cleaner:</strong> ${rep.employeename || 'Not provided'} • <strong>Date:</strong> ${dataFormatada}</p>
                            <p class="text-xs text-slate-400 mt-1"><strong>Originally created by:</strong> ${formatarNomePerfil(rep.staff)}</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="editarRelatorio('${rep.id}')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition-colors">Edit</button>
                            <button onclick="baixarPDF('${rep.id}')" id="btn-pdf-${rep.id}" class="px-4 py-2 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl text-sm shadow-sm transition-colors">📄 PDF</button>
                            <button onclick="excluirRelatorio('${rep.id}')" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-600 font-bold rounded-xl text-sm transition-colors">Delete</button>
                        </div>
                        </div>
                    `;
                });
            } catch(err) {
                container.innerHTML = `<div class="bg-red-50 p-6 rounded-2xl text-center border border-red-200 text-red-600 font-bold">Error loading: ${err.message}</div>`;
            }
        }

        function editarRelatorio(id) { window.location.href = `reports.html?id=${id}`; }

        async function excluirRelatorio(id) {
            if (!confirm('Are you sure you want to delete this report?')) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (!res.ok) throw new Error(await res.text());
                carregarLista();
            } catch(err) { alert('Error deleting: ' + err.message); }
        }

        /* LÓGICA DO PDF - ATUALIZADA PARA INJETAR O USUÁRIO ATUAL */
        async function baixarPDF(id) {
            const btn = document.getElementById(`btn-pdf-${id}`);
            const txtOriginal = btn.innerText;
            btn.innerText = "Generating..."; btn.disabled = true;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?id=eq.${id}&limit=1`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });

                const db = await res.json();
                const rep = db[0];

                if (!rep) {
                    alert('Report not found.');
                    btn.innerHTML = txtOriginal; btn.disabled = false;
                    return;
                }

                const b = rep.building || 'Not provided';
                const e = rep.employeename || '';
                const d = rep.date || '';
                const s = rep.summary || '';
                const selectedPeriod = rep.period || 'Daily';
                const selectedPdfDisplayOption = rep.pdfdisplayoption || 'both';
                const locations = rep.locations || [];

                // BUGFIX: PUXA FORÇADAMENTE O NOME DA PESSOA LOGADA PARA ASSINAR O PDF
                let fullNameLogado = localStorage.getItem('loggedFullName') || localStorage.getItem('loggedUser');
                let roleLogado = localStorage.getItem('loggedRole') || 'Staff';
                const staffGeradorPDF = `${fullNameLogado} - ${roleLogado}`;

                const doc = new window.jspdf.jsPDF(); 
                let y = 20;

                const corVerde = [84, 124, 68]; 
                const corDado = [30, 30, 30]; 
                const corTextoLiso = [80, 80, 80]; 

                const getLogo = () => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = 'logo.png'; });
                const logoImg = await getLogo();

                if (logoImg) {
                    const maxW = 40, maxH = 25;
                    let w = logoImg.width, h = logoImg.height;
                    if (w > h) { h = h * (maxW / w); w = maxW; } else { w = w * (maxH / h); h = maxH; }
                    doc.addImage(logoImg, 'PNG', 15, y - 5, w, h);
                }

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(26);
                doc.setTextColor(...corVerde);
                doc.text('CLEANING REPORT', 195, y + 10, { align: 'right' });

                y += 30; 

                doc.setDrawColor(...corVerde);
                doc.setLineWidth(0.6);
                doc.line(15, y, 195, y);
                y += 12;

                doc.setFontSize(12);
                const addInfo = (lbl, valor, posY) => {
                    doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                    doc.text(lbl, 15, posY);
                    if (valor) {
                        doc.setFont('helvetica', 'normal'); doc.setTextColor(...corDado);
                        doc.text(valor, 60, posY);
                    }
                };

                addInfo('Prepared by:', staffGeradorPDF, y); y += 8;
                addInfo('Cleaning Staff:', e, y); y += 8;

                if (selectedPdfDisplayOption==='date'||selectedPdfDisplayOption==='both') {
                    addInfo('Date:', d ? d.split('-').reverse().join('/') : '', y); y += 8;
                }
                if (selectedPdfDisplayOption==='period'||selectedPdfDisplayOption==='both') {
                    addInfo('Report Type:', selectedPeriod, y); y += 8;
                }

                y += 8; 

                doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                doc.text('Summary of Work', 15, y); y += 6; 

                const textoPadraoResumo = `Cleaning staff member ${e || '[employee name]'} carried out cleaning tasks in the following areas using appropriate machinery and equipment. The work included floor cleaning and dust removal with the machine.`;
                const txtResumo = s || textoPadraoResumo;

                doc.setFontSize(12); doc.setFont('helvetica', 'normal'); 
                const splitS = doc.splitTextToSize(txtResumo, 160);
                const boxH = splitS.length * 6 + 10;

                doc.setFillColor(248, 249, 250); 
                doc.setDrawColor(220, 220, 220); 
                doc.setLineWidth(0.3);
                doc.roundedRect(15, y, 180, boxH, 2, 2, 'FD');

                doc.setTextColor(...corTextoLiso);
                doc.text(splitS, 20, y + 8);
                y += boxH + 15; 

                if (y > 250) { doc.addPage(); y = 20; }

                doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                doc.text('Building / Property:', 15, y);

                y += 8;
                doc.setFontSize(14); doc.setFont('helvetica', 'normal'); doc.setTextColor(...corDado);
                doc.text(b, 15, y);

                y += 15; 

                doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                doc.text('Locations Cleaned:', 15, y); y += 10;

                if (!locations.length) { 
                    doc.setFontSize(12); doc.setFont('helvetica', 'normal'); doc.setTextColor(...corDado);
                    doc.text('No areas attached.', 15, y); y += 8; 
                } else { 
                    locations.forEach(loc => { 
                        if(y>275) { doc.addPage(); y = 20; } 

                        doc.setFillColor(...corVerde); 
                        doc.circle(16, y - 1.5, 1.2, 'F'); 

                        doc.setTextColor(...corDado); doc.setFont('helvetica', 'normal'); doc.setFontSize(12); 
                        doc.text(loc.name || 'Unnamed location', 22, y); 
                        y += 8; 

                        if (loc.sublocations && loc.sublocations.length > 0) {
                        doc.setTextColor(110, 110, 110); 
                        doc.setFontSize(11);
                        loc.sublocations.forEach(sub => {
                        if (sub.trim() !== '') {
                        if(y>275) { doc.addPage(); y = 20; } 
                        doc.text(`- ${sub}`, 26, y);
                        y += 6;
                        }
                        });
                        y += 2; 
                        }
                    }); 
                }

                const totalFotos = locations.reduce((a, l) => a + l.photos.length, 0);
                if (totalFotos > 0) {
                    doc.addPage(); y = 20;
                    doc.setFontSize(22); doc.setFont('helvetica', 'bold'); doc.setTextColor(...corVerde);
                    doc.text('Photographic Evidence', 15, y); y += 15;

                    locations.forEach(loc => {
                        if (!loc.photos.length) return;
                        if(y>250){doc.addPage();y=20;}

                        doc.setFontSize(14); doc.setFont('helvetica', 'normal');
                        doc.setFillColor(...corVerde); doc.rect(15, y - 4, 2, 5, 'F'); 
                        doc.setTextColor(...corDado); doc.text(loc.name || 'Unnamed location', 20, y); 
                        y += 10;

                        let x = 15; const imgSize = 55; const espaco = 6;

                        loc.photos.forEach(img => {
                        if (x + imgSize > 195) { x = 15; y += imgSize + 15; }
                        if (y + imgSize > 275) { doc.addPage(); y = 20; x = 15; }

                        doc.setDrawColor(210, 210, 210);
                        doc.setLineWidth(0.4);
                        doc.rect(x - 0.5, y - 0.5, imgSize + 1, imgSize + 1);

                        try { doc.addImage(img, 'JPEG', x, y, imgSize, imgSize); } catch(e){} 
                        x += imgSize + espaco;
                        });
                        y += imgSize + 15;
                    });
                }

                const nomeSanitizado = e.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
                const dataSanitizada = d ? d.replace(/-/g, '') : 'no_date';
                doc.save(`Cleaning_Report_${nomeSanitizado}_${selectedPeriod}_${dataSanitizada}.pdf`);
            } catch(err) {
                alert('Error generating PDF: ' + err.message);
            }

            btn.innerHTML = "📄 PDF"; btn.disabled = false;
        }
    </script>
</body>
</html>
