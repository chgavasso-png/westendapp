<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Builder - West End</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Print Styles - Ensures perfect A4 PDF generation */
        @media print {
            body { background-color: white !important; margin: 0; padding: 0; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .a4-page { box-shadow: none !important; margin: 0 !important; padding: 10mm 15mm !important; width: 100% !important; max-width: 100% !important; border: none !important; }
            @page { size: A4; margin: 0mm; }
            .print-no-arrow { appearance: none !important; -webkit-appearance: none !important; -moz-appearance: none !important; }
            .print-no-icon::-webkit-calendar-picker-indicator { display: none !important; }
            input, select { border: none !important; background: transparent !important; }
        }
        
        /* Interactive text styles (disappears on print) */
        [contenteditable="true"]:hover { background-color: rgba(84, 124, 68, 0.05); cursor: text; border-radius: 4px; }
        [contenteditable="true"]:focus { background-color: rgba(84, 124, 68, 0.05); outline: 1px dashed #547C44; border-radius: 4px; }
        
        .task-list { list-style-type: disc; padding-left: 1.5rem; outline: none; min-height: 20px;}
        .task-list li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 min-h-screen pb-20">

    <!-- TOOLBAR (NO-PRINT) -->
    <div class="no-print bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="menu.html" class="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors" title="Back to Menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">Schedule Builder</h2>
                    <p class="text-xs text-slate-500 font-medium uppercase mt-1">Tip: Click on texts to edit</p>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <button onclick="openStaffModal()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border transition-colors flex items-center gap-2">
                    👥 Manage Staff
                </button>
                <button onclick="saveSchedule()" class="px-5 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl border border-blue-200 transition-colors">
                    💾 Save Changes
                </button>
                <button onclick="window.print()" class="px-6 py-2 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl shadow-md transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Generate PDF
                </button>
                <button onclick="clearAll()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl border border-red-200 transition-colors" title="Clear Document">
                    Clear
                </button>
            </div>
        </div>
    </div>

    <!-- A4 SHEET (MAIN DOCUMENT) -->
    <div class="mt-8 flex justify-center px-2">
        <div id="document-a4" class="a4-page bg-white shadow-2xl w-full max-w-[21cm] min-h-[29.7cm] p-[15mm] border border-slate-200 relative">
            
            <!-- HEADER -->
            <div class="flex flex-col items-center mb-8 border-b-2 border-[#547C44] pb-6 relative group">
                <img src="logo.png" alt="West End Cleaning" class="h-28 object-contain mb-4" onerror="this.src='https://via.placeholder.com/200x100?text=Logo+West+End'">
                <!-- Building Name -->
                <input type="text" value="BUILDING NAME HERE" class="w-full text-3xl font-black text-[#547C44] uppercase tracking-wider text-center outline-none bg-transparent" placeholder="BUILDING NAME HERE">
                <h2 class="text-xl font-bold text-slate-600 tracking-widest uppercase mt-1 text-center" contenteditable="true">Cleaning Schedule</h2>
            </div>

            <!-- SUMMARY OF HOURS -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-8 relative">
                <table class="w-full text-sm font-bold text-slate-700">
                    <tbody id="tbody-summary">
                        <!-- Initial Default Row -->
                        <tr class="border-b border-slate-200 group/tr">
                            <td class="py-2 w-1/3 relative pl-8">
                                <button class="no-print absolute left-0 top-1.5 text-red-500 font-bold hidden group-hover/tr:block bg-red-50 px-2 rounded hover:bg-red-100" onclick="this.closest('tr').remove()" title="Remove Row">X</button>
                                <select class="font-bold text-slate-700 bg-transparent outline-none cursor-pointer print-no-arrow w-full">
                                    <option>SUNDAY</option>
                                    <option>MONDAY</option>
                                    <option>TUESDAY</option>
                                    <option>WEDNESDAY</option>
                                    <option>THURSDAY</option>
                                    <option>FRIDAY</option>
                                    <option>SATURDAY</option>
                                    <option>MONDAY TO THURSDAY</option>
                                    <option>MONDAY TO FRIDAY</option>
                                    <option>WEEKENDS</option>
                                    <option>EVERYDAY</option>
                                </select>
                            </td>
                            <td class="py-2 w-1/3 text-center">
                                START TIME: <input type="time" value="19:00" class="font-bold text-slate-700 bg-transparent outline-none cursor-pointer print-no-icon">
                            </td>
                            <td class="py-2 w-1/3 text-right pr-4">
                                FINISH TIME: <input type="time" value="01:00" class="font-bold text-slate-700 bg-transparent outline-none cursor-pointer print-no-icon">
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button onclick="addSummaryRow()" class="no-print mt-3 text-xs font-bold text-[#547C44] hover:underline flex items-center gap-1">
                    + Add Shift Time
                </button>
            </div>

            <!-- SHIFT BLOCKS CONTAINER -->
            <div id="blocks-container">
                <!-- Shift blocks will be inserted here -->
            </div>

            <div class="no-print mt-6 text-center">
                <button onclick="addBlock()" class="px-6 py-3 border-2 border-dashed border-[#547C44] text-[#547C44] font-bold rounded-2xl hover:bg-[#547C44] hover:text-white transition-all">
                    + Add New Table (Shift/Day)
                </button>
            </div>

            <!-- FOOTER -->
            <div class="mt-12 text-center text-xs text-slate-400 border-t border-slate-200 pt-4">
                Official Document - West End Cleaning Services Ltd
            </div>
        </div>
    </div>

    <!-- MODAL: MANAGE STAFF -->
    <div id="modal-staff" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-md shadow-2xl border border-slate-100">
            <h3 class="text-xl font-black text-slate-800 mb-2">Staff Database</h3>
            <p class="text-sm text-slate-500 mb-6">Add names and default schedules to auto-fill tables.</p>
            
            <div class="flex flex-col gap-3 mb-4 border-b pb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">Employee Name</label>
                    <input type="text" id="new-staff-name" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="E.g., Fernando">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 pl-1">Default Time</label>
                    <input type="text" id="new-staff-time" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#547C44]" placeholder="E.g., 19:00 - 01:00">
                </div>
                <button onclick="saveNewStaff()" class="w-full py-3 mt-1 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl transition-colors">Add Employee</button>
            </div>

            <ul id="staff-list" class="space-y-2 max-h-48 overflow-y-auto mb-6 bg-slate-50 p-3 rounded-xl border border-slate-200">
                <!-- Injected List -->
            </ul>

            <button onclick="closeStaffModal()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">Close</button>
        </div>
    </div>

    <!-- MODAL: ADD ROW TO TABLE (STAFF) -->
    <div id="modal-row" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl border border-slate-100">
            <h3 class="text-xl font-black text-slate-800 mb-4">Add to Shift</h3>
            
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Select Employee</label>
            <select id="select-staff" onchange="autoFillTime(this)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none mb-4 font-bold text-slate-700">
                <!-- Injected Options -->
            </select>

            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Time (Auto-filled)</label>
            <input type="text" id="input-time" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none mb-6 font-bold" placeholder="E.g., 19:00 - 01:00">

            <div class="flex gap-3">
                <button onclick="closeRowModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">Cancel</button>
                <button onclick="confirmNewRow()" class="flex-1 py-3 bg-[#547C44] hover:bg-[#436435] text-white font-bold rounded-xl shadow-md transition-colors">Insert</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // LOCAL DATABASE FOR STAFF
        // Migration support for old data arrays
        let rawDB = JSON.parse(localStorage.getItem('we_staff_db') || '[]');
        let dbStaff = rawDB.map(item => typeof item === 'string' ? { name: item, time: '19:00 - 01:00' } : item);
        
        let targetTable = null; 

        window.onload = function() {
            if (!localStorage.getItem('loggedUser')) window.location.href = 'index.html';
            
            // Load saved schedule if exists
            const savedHtml = localStorage.getItem('schedule_doc_html');
            if (savedHtml) {
                document.getElementById('document-a4').innerHTML = savedHtml;
            } else {
                addBlock();
            }
        };

        /* ================== MANAGE STAFF ================== */
        function openStaffModal() {
            renderStaffList();
            document.getElementById('modal-staff').classList.remove('hidden');
        }
        function closeStaffModal() {
            document.getElementById('modal-staff').classList.add('hidden');
        }
        function saveNewStaff() {
            const name = document.getElementById('new-staff-name').value.trim();
            const time = document.getElementById('new-staff-time').value.trim();
            if(name) {
                dbStaff.push({ name: name, time: time });
                localStorage.setItem('we_staff_db', JSON.stringify(dbStaff));
                document.getElementById('new-staff-name').value = '';
                document.getElementById('new-staff-time').value = '';
                renderStaffList();
            }
        }
        function deleteStaff(index) {
            dbStaff.splice(index, 1);
            localStorage.setItem('we_staff_db', JSON.stringify(dbStaff));
            renderStaffList();
        }
        function renderStaffList() {
            const ul = document.getElementById('staff-list');
            if(dbStaff.length === 0) {
                ul.innerHTML = '<li class="text-slate-400 text-sm text-center py-2">No staff saved.</li>';
                return;
            }
            ul.innerHTML = dbStaff.map((staff, i) => `
                <li class="flex justify-between items-center bg-white p-2 px-3 border border-slate-200 rounded-lg">
                    <div>
                        <span class="font-bold text-slate-700 block">${staff.name}</span>
                        <span class="text-xs text-slate-500 font-medium">${staff.time || 'No default time set'}</span>
                    </div>
                    <button onclick="deleteStaff(${i})" class="text-red-500 font-bold hover:bg-red-50 px-2 py-1 rounded transition-colors">X</button>
                </li>
            `).join('');
        }

        /* ================== SCHEDULE STRUCTURE ================== */
        
        function addSummaryRow() {
            const tbody = document.getElementById('tbody-summary');
            const tr = document.createElement('tr');
            tr.className = "border-b border-slate-200 group/tr";
            tr.innerHTML = `
                <td class="py-2 w-1/3 relative pl-8">
                    <button class="no-print absolute left-0 top-1.5 text-red-500 font-bold hidden group-hover/tr:block bg-red-50 px-2 rounded hover:bg-red-100" onclick="this.closest('tr').remove()" title="Remove Row">X</button>
                    <select class="font-bold text-slate-700 bg-transparent outline-none cursor-pointer print-no-arrow w-full">
                        <option>SUNDAY</option>
                        <option>MONDAY</option>
                        <option>TUESDAY</option>
                        <option>WEDNESDAY</option>
                        <option>THURSDAY</option>
                        <option>FRIDAY</option>
                        <option>SATURDAY</option>
                        <option>MONDAY TO THURSDAY</option>
                        <option>MONDAY TO FRIDAY</option>
                        <option>WEEKENDS</option>
                        <option>EVERYDAY</option>
                    </select>
                </td>
                <td class="py-2 w-1/3 text-center">
                    START TIME: <input type="time" value="19:00" class="font-bold text-slate-700 bg-transparent outline-none cursor-pointer print-no-icon">
                </td>
                <td class="py-2 w-1/3 text-right pr-4">
                    FINISH TIME: <input type="time" value="01:00" class="font-bold text-slate-700 bg-transparent outline-none cursor-pointer print-no-icon">
                </td>
            `;
            tbody.appendChild(tr);
        }

        function addBlock() {
            const container = document.getElementById('blocks-container');
            const block = document.createElement('div');
            block.className = "mb-10 shift-block";
            block.innerHTML = `
                <input type="text" value="SHIFT TITLE HERE (E.G., SUNDAYS SCHEDULES)" class="w-full bg-[#547C44] text-white font-bold py-2 px-4 text-center uppercase tracking-widest outline-none placeholder-white/70">
                
                <table class="w-full border-collapse border border-slate-300 mt-2 text-sm relative">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase">
                            <th class="border border-slate-300 py-2 px-3 text-left w-1/4">Employer</th>
                            <th class="border border-slate-300 py-2 px-3 text-left w-1/5">Time</th>
                            <th class="border border-slate-300 py-2 px-3 text-left">Task</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows injected here -->
                    </tbody>
                </table>
                <div class="no-print mt-3 flex items-center justify-between">
                    <button class="text-sm font-bold text-[#547C44] hover:underline" onclick="openRowModal(this)">+ Add Staff to this table</button>
                    <button class="text-sm font-bold text-red-500 hover:underline" onclick="if(confirm('Delete this entire table?')) this.closest('.shift-block').remove()">Delete Table</button>
                </div>
            `;
            container.appendChild(block);
        }

        /* ================== ADD STAFF ROW & TASKS ================== */
        function openRowModal(btn) {
            targetTable = btn.parentElement.previousElementSibling.querySelector('tbody');
            const select = document.getElementById('select-staff');
            
            select.innerHTML = '<option value="">-- Select Employee --</option>' + 
                               dbStaff.map((s, i) => `<option value="${i}" data-time="${s.time}">${s.name}</option>`).join('');
            
            document.getElementById('input-time').value = '';
            document.getElementById('modal-row').classList.remove('hidden');
        }

        function autoFillTime(select) {
            if(select.selectedIndex > 0) {
                const time = select.options[select.selectedIndex].getAttribute('data-time');
                document.getElementById('input-time').value = time || '';
            } else {
                document.getElementById('input-time').value = '';
            }
        }

        function closeRowModal() {
            document.getElementById('modal-row').classList.add('hidden');
            targetTable = null;
        }

        function confirmNewRow() {
            const select = document.getElementById('select-staff');
            if(!select.value) return alert("Select an employee. If empty, click 'Manage Staff' to add them.");
            
            const emp = select.options[select.selectedIndex].text;
            const time = document.getElementById('input-time').value;

            const tr = document.createElement('tr');
            tr.className = "group/row";
            tr.innerHTML = `
                <td class="border border-slate-300 py-3 px-3 font-bold align-top relative">
                    <button class="no-print absolute -left-6 top-3 text-red-500 font-bold hidden group-hover/row:block bg-red-50 px-2 rounded" onclick="this.closest('tr').remove()" title="Delete Staff Row">X</button>
                    <div contenteditable="true" class="outline-none">${emp}</div>
                </td>
                <td class="border border-slate-300 py-3 px-3 font-bold text-slate-600 align-top"><div contenteditable="true" class="outline-none">${time}</div></td>
                <td class="border border-slate-300 py-3 px-3 align-top">
                    <div class="task-group mb-4 relative group/cat">
                        <button class="no-print absolute -left-6 top-0 text-red-500 font-bold hidden group-hover/cat:block" onclick="this.parentElement.remove()" title="Remove Category">X</button>
                        <div class="font-bold text-[#547C44] outline-none uppercase" contenteditable="true">Category (e.g., Kitchen)</div>
                        <ul class="task-list outline-none" contenteditable="true">
                            <li>Type your first task here...</li>
                        </ul>
                    </div>
                    <button class="no-print text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded transition-colors" onclick="addCategoryToTask(this)">+ Add Category</button>
                </td>
            `;
            
            targetTable.appendChild(tr);
            closeRowModal();
        }

        function addCategoryToTask(btn) {
            const div = document.createElement('div');
            div.className = "task-group mb-4 relative group/cat";
            div.innerHTML = `
                <button class="no-print absolute -left-6 top-0 text-red-500 font-bold hidden group-hover/cat:block" onclick="this.parentElement.remove()" title="Remove Category">X</button>
                <div class="font-bold text-[#547C44] outline-none uppercase" contenteditable="true">New Category</div>
                <ul class="task-list outline-none" contenteditable="true">
                    <li>New task...</li>
                </ul>
            `;
            btn.parentElement.insertBefore(div, btn);
        }

        /* ================== SAVE SYSTEM ================== */
        // Synchronizes input and select states into their HTML attributes so they save correctly inside innerHTML
        function syncInputsBeforeSave() {
            document.querySelectorAll('#document-a4 input').forEach(inp => {
                if(inp.type !== 'file') {
                    inp.setAttribute('value', inp.value);
                }
            });
            document.querySelectorAll('#document-a4 select').forEach(sel => {
                Array.from(sel.options).forEach(opt => {
                    if(opt.selected) opt.setAttribute('selected', 'selected');
                    else opt.removeAttribute('selected');
                });
            });
        }

        function saveSchedule() {
            syncInputsBeforeSave();
            const documentHtml = document.getElementById('document-a4').innerHTML;
            localStorage.setItem('schedule_doc_html', documentHtml);
            alert("Success! The schedule has been saved to your browser.");
        }

        function clearAll() {
            if(confirm("WARNING: This will delete all tables and texts from the current document. Are you sure?")) {
                localStorage.removeItem('schedule_doc_html');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
